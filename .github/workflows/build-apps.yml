name: Build SuperMusic PRO Mobile (iOS & Android)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: 🍏 Compila iOS (.ipa)
    runs-on: macos-14

    steps:
      - name: Checkout Codice
        uses: actions/checkout@v4

      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Installa Dipendenze
        run: npm install

      - name: Compila Web Assets
        run: npm run build

      - name: Sincronizza Capacitor iOS
        run: npx cap sync ios

      - name: Seleziona Versione Xcode
        run: sudo xcode-select -switch /Applications/Xcode_15.4.app/Contents/Developer

      - name: Compila Progetto Xcode (Unsigned / Ad-Hoc)
        run: |
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Confeziona Pacchetto IPA
        run: |
          mkdir -p build/Payload
          cp -r build/App.xcarchive/Products/Applications/App.app build/Payload/
          cd build
          zip -r SuperMusic_PRO_v2.3.0.ipa Payload

      - name: 📦 Salva Artefatto iOS (.ipa)
        uses: actions/upload-artifact@v4
        with:
          name: SuperMusic_PRO_iOS_v2.3.0.ipa
          path: build/SuperMusic_PRO_v2.3.0.ipa
          retention-days: 30

  build-android:
    name: 🤖 Compila Android (.apk)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codice
        uses: actions/checkout@v4

      - name: Configura Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configura Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Installa Dipendenze
        run: npm install

      - name: Compila Web Assets
        run: npm run build

      - name: Sincronizza Capacitor Android
        run: npx cap sync android

      - name: Concedi Permessi di Esecuzione a Gradlew
        run: chmod +x android/gradlew

      - name: Compila APK Android
        run: |
          cd android
          ./gradlew assembleDebug

      - name: 📦 Salva Artefatto Android (.apk)
        uses: actions/upload-artifact@v4
        with:
          name: SuperMusic_PRO_Android_v2.3.0.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
