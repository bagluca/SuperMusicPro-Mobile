<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <radialGradient id="vinyl" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="40%" stop-color="#0f172a" />
      <stop offset="70%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </radialGradient>
    <radialGradient id="centerLabel" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="70%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="500" height="500" rx="28" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="4" />
  <!-- Vinyl disc outer -->
  <circle cx="250" cy="250" r="185" fill="url(#vinyl)" stroke="#334155" stroke-width="3" />
  <!-- Grooves -->
  <circle cx="250" cy="250" r="160" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,6" opacity="0.6" />
  <circle cx="250" cy="250" r="135" fill="none" stroke="#475569" stroke-width="1" stroke-dasharray="8,4" opacity="0.5" />
  <circle cx="250" cy="250" r="110" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="5,5" opacity="0.6" />
  <circle cx="250" cy="250" r="85" fill="none" stroke="#1e293b" stroke-width="2" />
  <!-- Center Record Label -->
  <circle cx="250" cy="250" r="62" fill="url(#centerLabel)" filter="url(#glow)" />
  <circle cx="250" cy="250" r="56" fill="none" stroke="#34d399" stroke-width="1.5" opacity="0.8" />
  <!-- Musical note in center -->
  <path d="M242 268 V232 C242 227 246 224 252 225 L268 228 C271 228 274 231 274 235 V260" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="236" cy="268" r="9" fill="#ffffff" />
  <circle cx="268" cy="260" r="9" fill="#ffffff" />
  <!-- Spindle hole -->
  <circle cx="250" cy="250" r="8" fill="#090d16" stroke="#34d399" stroke-width="2" />
</svg>
